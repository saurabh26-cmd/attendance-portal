{% extends "base.html" %}{% block content %}<h2>Employee Master</h2><div class="card"><form method="post" class="grid"><input name="code" placeholder="Employee ID" required><input name="name" placeholder="Employee Name" required><select name="designation"><option>Picker/Packer</option><option>Inward Executive</option><option>Security Guard</option><option>Housekeeping</option><option>Other</option></select><input name="location" list="locs" placeholder="Warehouse" required><datalist id="locs">{% for l in locations %}<option value="{{l.location}}">{% endfor %}</datalist><button>Add Employee</button></form></div><div class="card scroll"><table><tr><th>ID</th><th>Name</th><th>Designation</th><th>Location</th></tr>{% for e in employees %}<tr><td>{{e.employee_code}}</td><td>{{e.name}}</td><td>{{e.designation}}</td><td>{{e.location}}</td></tr>{% endfor %}</table></div>{% endblock %}
