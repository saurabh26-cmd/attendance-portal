{% extends "base.html" %}{% block content %}<h2>Admin — Create Manager Login</h2><div class="card"><form method="post" class="grid"><input name="name" placeholder="Manager Name" required><input name="login_id" placeholder="Login ID" required><input name="password" type="password" placeholder="Password" required><select name="location">{% for l in locations %}<option>{{l.location}}</option>{% endfor %}</select><button>Create Login</button></form></div><div class="card"><table><tr><th>Name</th><th>Login ID</th><th>Role</th><th>Location</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.login_id}}</td><td>{{u.role}}</td><td>{{u.location}}</td></tr>{% endfor %}</table></div>{% endblock %}
