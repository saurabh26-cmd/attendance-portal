{% extends "base.html" %}{% block content %}<h2>{{month_name}} {{year}} Summary</h2><form method="get" class="card grid"><label>Warehouse<select name="location">{% for l in locations %}<option {% if l==location %}selected{% endif %}>{{l}}</option>{% endfor %}</select></label><label>Year<input name="year" type="number" value="{{year}}"></label><label>Month<input name="month" type="number" value="{{month}}" min="1" max="12"></label><button>Generate</button></form><div class="card scroll"><table><tr><th>Employee ID</th><th>Name</th><th>Designation</th><th>Present</th><th>Absent</th><th>Leave</th><th>Weekly Off</th></tr>{% for e,c in report %}<tr><td>{{e.employee_code}}</td><td>{{e.name}}</td><td>{{e.designation}}</td><td>{{c.P}}</td><td>{{c.A}}</td><td>{{c.L}}</td><td>{{c.WO}}</td></tr>{% endfor %}</table></div>{% endblock %}
